<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Portal — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      font-family: system-ui, sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
    }
    header {
      background: #1e293b;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    .user-info { display: flex; align-items: center; gap: 16px; }
    .user-info span { color: #94a3b8; font-size: 14px; }
    .logout {
      background: #334155;
      border: none;
      color: #f1f5f9;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .logout:hover { background: #475569; }
    main { padding: 32px; max-width: 1100px; margin: 0 auto; }
    h2 { font-size: 20px; margin-bottom: 20px; color: #e2e8f0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #e2e8f0; }
    .card p { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .card p span { color: #f1f5f9; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
    }
    .badge.active { background: #14532d; color: #86efac; }
    .badge.inactive { background: #450a0a; color: #fca5a5; }
    .loading { color: #94a3b8; text-align: center; padding: 60px; }
    .empty { color: #94a3b8; text-align: center; padding: 60px; }
  </style>
</head>
<body>
  <!-- Add this right after <body> opens, before <header> -->
<div id="debugPanel" style="background:#0a0e1a;border:1px solid #f59e0b;border-radius:10px;margin:1rem;padding:1rem;font-family:monospace;font-size:.75rem;color:#fcd34d;max-height:200px;overflow-y:auto">
  <strong style="color:#f59e0b">🔍 DEBUG — remove before production</strong>
  <div id="debugLog"></div>
</div>

  <header>
    <h1>Customer Portal</h1>
    <div class="user-info">
      <span id="userName"></span>
      <button class="logout" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <main>
    <h2>Your Assets</h2>
    <div class="grid" id="assetGrid">
      <p class="loading">Loading assets...</p>
    </div>
  </main>

  <script>
function dlog(msg, type='info') {
  console.log('[DEBUG]', msg);
  const el = document.createElement('div');
  el.style.cssText = 'padding:2px 0;border-bottom:1px solid rgba(245,158,11,.15);color:' + (type==='ok'?'#86efac':type==='err'?'#fca5a5':'#93c5fd');
  el.textContent = new Date().toISOString().slice(11,23) + ' ' + msg;
  document.getElementById('debugLog').prepend(el);
}

async function init() {
  dlog('Cookies present: ' + (document.cookie ? document.cookie.split(';').map(c=>c.trim().split('=')[0]).join(', ') : 'NONE'), 'info');
  dlog('Calling /api/portal-auth...', 'info');

  const authRes = await fetch('/api/portal-auth', {
    method: 'GET',
    credentials: 'include',
    headers: { 'Accept': 'application/json' }
  });

  dlog('portal-auth → ' + authRes.status, authRes.ok ? 'ok' : 'err');

  if (!authRes.ok) {
    const body = await authRes.text();
    dlog('Auth body: ' + body, 'err');
    window.location.href = '/login.html';
    return;
  }

  const session = await authRes.json();
  dlog('Session: ' + JSON.stringify(session), 'ok');
  document.getElementById('userName').textContent = session.name || session.userId;

  dlog('Calling /api/portal-data?resource=assets...', 'info');
  const dataRes = await fetch('/api/portal-data?resource=assets', {
    credentials: 'include',
    headers: { 'Accept': 'application/json' }
  });

  dlog('assets → ' + dataRes.status, dataRes.ok ? 'ok' : 'err');

  const grid = document.getElementById('assetGrid');

  if (!dataRes.ok) {
    const body = await dataRes.text();
    dlog('Assets error body: ' + body, 'err');
    grid.innerHTML = '<p class="empty">Failed to load assets.</p>';
    return;
  }

  const payload = await dataRes.json();
  dlog('Assets payload keys: ' + Object.keys(payload).join(', '), 'info');

  const assets = payload.assets || [];
  dlog('Assets count: ' + assets.length, assets.length ? 'ok' : 'err');

  if (!assets.length) {
    grid.innerHTML = '<p class="empty">No assets found for your account.</p>';
    return;
  }

  grid.innerHTML = assets.map(a => {
    const active = a.active === 1 || a.active === '1';
    return '<div class="card">' +
      '<h3>' + (a.name || 'Unnamed Asset') + '</h3>' +
      '<p>Type: <span>' + (a.asset_type_name || '—') + '</span></p>' +
      '<p>Make: <span>' + (a.make || '—') + '</span></p>' +
      '<p>Model: <span>' + (a.model || '—') + '</span></p>' +
      '<p>Serial: <span>' + (a.serial || '—') + '</span></p>' +
      '<p>Location: <span>' + (a.location || '—') + '</span></p>' +
      (a.service_due ? '<p>Service Due: <span>' + a.service_due + '</span></p>' : '') +
      '<span class="badge ' + (active ? 'active' : 'inactive') + '">' + (active ? 'Active' : 'Inactive') + '</span>' +
      '</div>';
  }).join('');
}

document.getElementById('logoutBtn').addEventListener('click', async function() {
  await fetch('/api/portal-auth', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'logout' })
  });
  window.location.href = '/login.html';
});

init();
</script>

</body>
</html>
