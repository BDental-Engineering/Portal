<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Portal</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;--accent:#4f6ef7;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--text:#e2e8f0;--muted:#8892b0;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:.75rem;font-weight:700;font-size:1.05rem}
.nav-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-right{display:flex;align-items:center;gap:1rem}
.cust-name{color:var(--muted);font-size:.875rem}
.btn-signout{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:.4rem .9rem;cursor:pointer;font-size:.85rem;transition:all .2s}
.btn-signout:hover{border-color:var(--red);color:var(--red)}
.container{max-width:1100px;margin:0 auto;padding:2rem}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.section-title svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-bar{position:relative;margin-bottom:1.5rem;max-width:360px}
.search-bar svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.65rem .75rem .65rem 2.25rem;color:var(--text);font-size:.875rem;outline:none}
.search-bar input:focus{border-color:var(--accent)}
/* ASSET CARDS */
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem;margin-bottom:2.5rem}
.asset-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.asset-header{padding:1.25rem 1.25rem .75rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:.75rem}
.asset-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:.35rem}
.dot-green{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.4)}
.dot-amber{background:var(--amber);box-shadow:0 0 6px rgba(245,158,11,.4)}
.dot-red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.4)}
.asset-title{font-weight:700;font-size:1rem;margin-bottom:.2rem}
.asset-sub{color:var(--muted);font-size:.8rem}
.asset-meta{padding:.75rem 1.25rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem .75rem}
.meta-item{font-size:.8rem}
.meta-label{color:var(--muted);display:block;margin-bottom:.1rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.meta-val{color:var(--text)}
.asset-notes{padding:.5rem 1.25rem .75rem;font-size:.8rem;color:var(--muted);border-top:1px solid var(--border)}
/* DOCS & MANUALS INSIDE CARD */
.card-section{border-top:1px solid var(--border);padding:.75rem 1.25rem}
.card-section-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.6rem}
.doc-item{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid rgba(46,51,80,.4)}
.doc-item:last-child{border-bottom:none}
.doc-icon{font-size:.9rem}
.doc-link{color:var(--accent);font-size:.82rem;text-decoration:none;flex:1}
.doc-link:hover{text-decoration:underline}
.badge{display:inline-block;border-radius:20px;padding:.15rem .55rem;font-size:.68rem;font-weight:700;letter-spacing:.04em}
.badge-blue{background:rgba(79,110,247,.15);color:var(--accent)}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-muted{background:rgba(136,146,176,.12);color:var(--muted)}
.empty-mini{color:var(--muted);font-size:.8rem;padding:.25rem 0}
/* STANDALONE DOCS */
.docs-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.doc-row{display:flex;align-items:center;gap:1rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--border)}
.doc-row:last-child{border-bottom:none}
.doc-row:hover{background:rgba(255,255,255,.02)}
.doc-row-info{flex:1}
.doc-row-title{font-size:.9rem;font-weight:600;color:var(--accent);text-decoration:none}
.doc-row-title:hover{text-decoration:underline}
.doc-row-meta{font-size:.75rem;color:var(--muted);margin-top:.15rem}
/* EMPTY STATE */
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-state svg{width:56px;height:56px;margin:0 auto 1rem;display:block;opacity:.25;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty-state h3{font-size:1rem;color:var(--text);margin-bottom:.5rem}
/* LOADING */
.loading{text-align:center;padding:3rem;color:var(--muted)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    Customer Portal
  </div>
  <div class="nav-right">
    <span class="cust-name" id="custNameDisplay"></span>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
  </div>
</nav>

<div class="container" id="mainContent">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script>
let session=null;
let myAssets=[],myDocs=[],myManuals=[];

(async()=>{
  const r=await fetch('/api/portal-auth?action=session',{credentials:'include'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.role!=='customer'){location.href='portal-login.html';return;}
  session=d;
  document.getElementById('custNameDisplay').textContent=d.name||'';
  document.title=`${d.name||'My'} Portal`;
  await loadAll();
  render();
})();

async function loadAll(){
  const [ar,dr]=await Promise.all([
    fetch('/api/portal-assets',{credentials:'include'}).then(r=>r.json()).catch(()=>[]),
    fetch('/api/portal-documents',{credentials:'include'}).then(r=>r.json()).catch(()=>[])
  ]);
  myAssets=Array.isArray(ar)?ar.filter(a=>a.active):[];
  myDocs=Array.isArray(dr)?dr.filter(d=>d.active):[];
  // Load manuals for all asset make+model combos
  const combos=[...new Set(myAssets.map(a=>`${a.make}|${a.model}`))];
  const manResults=await Promise.all(combos.map(c=>{
    const[make,model]=c.split('|');
    return fetch(`/api/portal-manuals?make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}`,{credentials:'include'}).then(r=>r.json()).catch(()=>[]);
  }));
  myManuals=manResults.flat().filter((m,i,arr)=>arr.findIndex(x=>x.id===m.id)===i&&m.active);
}

function render(){
  const mc=document.getElementById('mainContent');
  const assetDocs=myDocs.filter(d=>d.assetId);
  const custDocs=myDocs.filter(d=>!d.assetId);
  mc.innerHTML=`
    <div class="section-title">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      My Assets
    </div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="assetSearch" placeholder="Search assets by name or model…" oninput="filterAssets()"/>
    </div>
    <div class="assets-grid" id="assetsGrid">${renderAssetCards(myAssets,assetDocs)}</div>
    <div class="section-title" style="margin-top:1rem">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      My Documents
    </div>
    \${custDocs.length?`<div class="docs-list">${custDocs.map(docRow).join('')}</div>`:`<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><h3>No documents yet</h3><p>Documents linked to your account will appear here.</p></div>`}
  `;
}

function renderAssetCards(assets,assetDocs){
  if(!assets.length)return`<div class="empty-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><h3>No assets linked</h3><p>Your assets will appear here once added by your administrator.</p></div>`;
  return assets.map(a=>{
    const dotClass=a.status==='attention'?'dot-amber':a.status==='fault'?'dot-red':'dot-green';
    const docs=assetDocs.filter(d=>d.assetId===a.id);
    const mans=myManuals.filter(m=>m.make.toLowerCase()===a.make?.toLowerCase()&&m.model.toLowerCase()===a.model?.toLowerCase());
    return`<div class="asset-card">
      <div class="asset-header">
        <div class="asset-dot \${dotClass}"></div>
        <div>
          <div class="asset-title">${esc(a.name)}</div>
          <div class="asset-sub">${esc(a.make||'')} \${esc(a.model||'')}</div>
        </div>
      </div>
      <div class="asset-meta">
        <div class="meta-item"><span class="meta-label">Serial Number</span><span class="meta-val">${esc(a.serialNumber||'—')}</span></div>
        <div class="meta-item"><span class="meta-label">Install Date</span><span class="meta-val">${a.installDate||'—'}</span></div>
      </div>
      \${a.notes?`<div class="asset-notes">📝 \${esc(a.notes)}</div>`:''}
      <div class="card-section">
        <div class="card-section-title">📄 Documents</div>
        \${docs.length?docs.map(d=>`<div class="doc-item"><span class="doc-icon">📎</span><a class="doc-link" href="${esc(d.fileUrl)}" target="_blank">${esc(d.title)}</a>${docTypeBadge(d.type)}</div>`).join(''):`<div class="empty-mini">No documents for this asset.</div>`}
      </div>
      <div class="card-section">
        <div class="card-section-title">📘 User Manuals</div>
        \${mans.length?mans.map(m=>`<div class="doc-item"><span class="doc-icon">📘</span><a class="doc-link" href="${esc(m.fileUrl)}" target="_blank">${esc(m.title)}</a></div>`).join(''):`<div class="empty-mini">No manuals found for \${esc(a.make)} \${esc(a.model)}.</div>`}
      </div>
    </div>`;
  }).join('');
}

function docRow(d){
  return`<div class="doc-row">
    <span style="font-size:1.2rem">📄</span>
    <div class="doc-row-info">
      <a class="doc-row-title" href="${esc(d.fileUrl)}" target="_blank">${esc(d.title)}</a>
      <div class="doc-row-meta">${d.type||'Document'} · \${fmtDate(d.uploadedAt)}</div>
    </div>
    \${docTypeBadge(d.type)}
  </div>`;
}

function filterAssets(){
  const q=document.getElementById('assetSearch').value.toLowerCase();
  const filtered=q?myAssets.filter(a=>a.name.toLowerCase().includes(q)||a.model?.toLowerCase().includes(q)||a.make?.toLowerCase().includes(q)):myAssets;
  const assetDocs=myDocs.filter(d=>d.assetId);
  document.getElementById('assetsGrid').innerHTML=renderAssetCards(filtered,assetDocs);
}

function docTypeBadge(t){
  const map={Manual:'badge-blue',Warranty:'badge-green',Invoice:'badge-amber',Certificate:'badge-green',Other:'badge-muted'};
  return`<span class="badge \${map[t]||'badge-muted'}">${t||'Other'}</span>`;
}

async function signOut(){
  await fetch('/api/portal-auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({action:'logout'})});
  location.href='portal-login.html';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return d;}}
</script>
</body>
</html>
